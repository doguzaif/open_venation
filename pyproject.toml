[project]
name = "simulation-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dogu Zaifoglu", email = "dzaifoglu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
]

[project.scripts]
simulation-python = "simulation_python:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
